[project]
name = "paper-refinery"
version = "0.1.0"
description = "Parse, figure-enrich, and chunk papers into RAG-ready chunks for papis-ask."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "glmocr[selfhosted]>=0.1.5",    # GLM-OCR SDK: PP-DocLayout-V3 layout + per-region OCR dispatch
  "llama-index-core>=0.14",       # MarkdownNodeParser / SentenceSplitter (chunking primitives)
  "google-genai>=1.0",            # Gemini: figure descriptions + citation extraction
  "click>=8.1",                   # CLI
  "beautifulsoup4>=4.12",         # parse GLM-OCR's HTML tables -> markdown
  "pillow>=10.0",                 # image handling (figure crops, page renders)
  "pydantic>=2.0",                # citation_extraction.py's response schema (already
                                   # transitive via google-genai; declared explicitly
                                   # since citation_extraction.py imports it directly)
  "python-dotenv>=1.0",           # loads API keys from ~/.config/paper-refinery/secrets/
                                   # (already transitive via glmocr; declared explicitly
                                   # since config.py imports it directly)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
refinery = "paper_refinery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
# basedpyright defaults to its strictest ("all") preset, which floods a deliberately
# dict-based pipeline with "annotate everything" noise. "standard" is the project gate:
# it keeps the substantive checks (Optional subscript/operand, call issues, deprecations,
# private-usage) and drops the annotate-every-dict firehose. Payloads are typed at the
# boundaries that matter (ParseResult, Chunk, TypedDicts as they land), not with blanket
# dict[str, Any].
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["paper_refinery"]
# a leading-underscore name imported across a module boundary is a mislabeled contract,
# not an internal -- keep this as a gate (standard leaves it off)
reportPrivateUsage = "error"

[tool.ruff]
line-length = 100
target-version = "py311"  # match requires-python's floor so UP targets the right syntax

[tool.ruff.lint]
# E/F (default) + I (enforce the import sort we keep by hand) + UP (modern syntax) + B
# (flake8-bugbear likely-bug patterns). RUF/SIM/PT stay off: mostly test-style (PT018) or
# false positives for this code (RUF001 on intentional en-dash/curly-apostrophe regexes).
select = ["E", "F", "I", "UP", "B"]

# glmocr's PP-DocLayout-V3 runs on CPU here (no NVIDIA GPU on this machine -- see
# glmocr/layout/layout_detector.py's torch.cuda.is_available() fallback). The default
# PyPI torch wheel bundles the full CUDA toolkit regardless (~3.4GB of nvidia_*/triton
# packages that are never exercised). A [tool.uv.pip] index pin here does NOT reliably
# take effect for `uv pip install` (confirmed: it silently let PyPI's CUDA build win
# over the pinned index) -- install torch/torchvision explicitly from the CPU index
# FIRST, then install the project; see README's setup section for the exact commands.
